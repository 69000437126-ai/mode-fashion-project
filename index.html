<style>
:root{--navy:#17233d;--blue:#5269e8;--bg:#f4f6fb;--ink:#20283a;--muted:#778198;--line:#e7eaf2;--green:#15956b;--red:#d94b62;--white:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,"Noto Sans Thai",Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:white;font-weight:600}button.secondary{background:#eef0ff;color:#4458cf}button.danger{background:#fff0f1;color:var(--red)}button.light{background:#f0f2f7;color:#4e5870}.app{display:flex;min-height:100vh}.sidebar{width:245px;background:var(--navy);color:#dce3f6;padding:24px 16px;display:flex;flex-direction:column;flex-shrink:0}.brand{font-size:24px;font-weight:900;letter-spacing:3px;color:#fff;padding:0 12px 5px}.brand small{display:block;font-size:11px;font-weight:400;letter-spacing:1px;color:#9ba9ca;margin-top:5px}.student{margin:20px 5px 26px;padding:12px;background:#263554;border:1px solid #3a4a6d;border-radius:10px;font-size:12px;color:#bdc8e1}.student strong{display:block;color:#fff;font-size:14px;margin-top:5px}.nav-label{font-size:10px;letter-spacing:1.5px;color:#8593b4;padding:0 12px 9px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{background:transparent;color:#c4cde2;text-align:left;padding:12px;border-radius:9px;font-weight:500}.nav button.active,.nav button:hover{background:#34466d;color:#fff}.nav .ico{display:inline-block;width:27px}.side-bottom{margin-top:auto;color:#8998b9;font-size:11px;padding:20px 10px 0;line-height:1.7}.main{min-width:0;flex:1}.topbar{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:15px}.crumb{font-weight:700}.crumb small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:4px}.topright{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}.avatar{width:36px;height:36px;border-radius:12px;background:#e9edff;color:#4c5fda;display:grid;place-items:center;font-weight:800}.student-chip{background:#f0f2ff;color:#485bce;padding:9px 11px;border-radius:9px;font-size:12px;font-weight:700}.content{padding:28px 30px;max-width:1600px;margin:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:24px}.page-head h1{font-size:25px;margin:0 0 7px}.page-head p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 3px 12px #26385805}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{background:#eef0ff;color:var(--blue);border-radius:10px;padding:8px}.stat-value{font-size:27px;font-weight:800;margin:14px 0 8px}.stat-foot{font-size:11px;color:var(--green)}.layout2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(270px,1fr);gap:18px}.panel h2{font-size:16px;margin:0 0 18px}.panel-sub{color:var(--muted);font-size:12px;margin-top:-11px;margin-bottom:15px}.bar-chart{height:205px;display:flex;align-items:end;gap:14px;border-bottom:1px solid var(--line);padding:12px 8px 0}.bar-group{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:end}.bar{width:min(36px,80%);border-radius:7px 7px 0 0;background:linear-gradient(180deg,#7788ff,#5269e8);min-height:6px}.bar-label{font-size:10px;color:var(--muted);padding-bottom:8px}.category-row{display:flex;align-items:center;gap:10px;margin:15px 0;font-size:12px}.dot{width:9px;height:9px;border-radius:50%;background:var(--blue)}.category-row span:nth-child(2){flex:1}.category-row strong{font-size:12px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:13px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}th{background:#f8f9fc;color:#7b8499;font-weight:600}tr:last-child td{border-bottom:0}.product-cell{display:flex;align-items:center;gap:10px}.product-pic{width:38px;height:42px;display:grid;place-items:center;border-radius:8px;background:#f0e9e4;font-size:20px}.product-name{font-weight:700}.muted{color:var(--muted)}.pill{display:inline-block;padding:5px 8px;border-radius:6px;background:#e8f8f1;color:#14825e;font-size:10px}.pill.low{background:#fff1dd;color:#b7771d}.pill.out{background:#ffeaed;color:#c43f54}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.toolbar input,.toolbar select,.field input,.field select{border:1px solid #dfe3ee;background:#fff;border-radius:9px;padding:10px 12px;color:var(--ink);outline:none}.toolbar input{min-width:210px;flex:1}.toolbar select{min-width:140px}.btn-sm{padding:7px 10px;font-size:11px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:600}.field input,.field select{width:100%;font-weight:400}.field.full{grid-column:1/-1}.modal-back{position:fixed;inset:0;background:#101a2e80;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal{background:white;border-radius:16px;padding:24px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h2{margin:0;font-size:18px}.close{background:#f1f3f8;color:#667085;padding:7px 11px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.sale-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(310px,.8fr);gap:18px}.product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.product-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:8px}.product-card:hover{border-color:#9aa6ff;box-shadow:0 4px 14px #5269e81c}.product-emoji{height:80px;border-radius:9px;display:grid;place-items:center;font-size:38px;background:#f6f0ec}.product-card strong{font-size:12px}.product-card small{color:var(--muted)}.product-card b{color:var(--blue);font-size:13px}.cart-line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.qty-controls{display:flex;align-items:center;gap:8px;margin-top:7px}.qty-controls button{padding:3px 8px;background:#eef0ff;color:#485bce}.total-row{display:flex;justify-content:space-between;margin:12px 0;font-size:13px}.total-row.grand{font-size:20px;font-weight:800;padding-top:12px;border-top:1px dashed #d9deea}.empty{text-align:center;padding:30px;color:var(--muted);font-size:13px}.report-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.report-card{background:#f8f9ff;border-radius:10px;padding:15px}.report-card small{color:var(--muted)}.report-card strong{display:block;font-size:22px;margin-top:9px}.notice{background:#f0f5ff;border:1px solid #dfe7ff;color:#4b5e9e;border-radius:10px;padding:12px;font-size:12px;line-height:1.6;margin-bottom:16px}.footer-student{margin-top:24px;text-align:right;color:#7d879d;font-size:11px}.toast{position:fixed;right:22px;bottom:22px;background:#17233d;color:white;padding:13px 18px;border-radius:10px;box-shadow:0 8px 28px #0002;display:none;z-index:20;font-size:13px}.mobile-menu{display:none}
@media(max-width:1000px){.sidebar{width:205px}.content{padding:22px 18px}.topbar{padding:0 18px}.stats{grid-template-columns:repeat(2,1fr)}.layout2,.sale-layout{grid-template-columns:1fr}.product-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.app{display:block}.sidebar{width:100%;padding:12px;display:block}.brand{display:inline-block;font-size:19px}.brand small{display:none}.student{display:inline-block;margin:0 0 0 10px;padding:8px;font-size:10px}.student strong{font-size:11px}.nav-label,.side-bottom{display:none}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px}.nav button{text-align:center;padding:9px 3px;font-size:10px}.nav .ico{display:block;width:auto;font-size:16px;margin-bottom:3px}.topbar{height:auto;padding:13px;align-items:flex-start}.topright{gap:7px}.student-chip{display:none}.content{padding:18px 12px}.page-head{flex-direction:column}.page-head h1{font-size:22px}.stats{gap:9px}.stat{padding:13px}.stat-value{font-size:22px}.stat-top{font-size:10px}.panel{padding:14px}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.product-card{padding:9px}.product-emoji{height:62px}.report-cards{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar input{min-width:100%}.toolbar select{flex:1}.topright .avatar{display:none}}
@media print{.sidebar,.topbar,.page-head .actions,.toolbar,.no-print,button{display:none!important}.main{width:100%}.content{padding:0}.panel,.stat{box-shadow:none;break-inside:avoid}body{background:white}.footer-student{display:block}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">MODE<small>FASHION STORE MANAGEMENT</small></div>
  <div class="student">รหัสนักศึกษา / STUDENT ID<strong>69000437126</strong></div>
  <div class="nav-label">WORKSPACE</div>
  <nav class="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>ภาพรวม</button>
    <button data-page="products"><span class="ico">◈</span>สินค้า</button>
    <button data-page="sales"><span class="ico">🛍</span>ขายสินค้า</button>
    <button data-page="reports"><span class="ico">▤</span>รายงาน</button>
  </nav>
  <div class="side-bottom">MODE FASHION STORE<br>ระบบตัวอย่างสำหรับโครงงาน<br>Student ID: 69000437126</div>
</aside>
<main class="main">
<header class="topbar">
  <div class="crumb" id="topTitle">ภาพรวมระบบ<small>ยินดีต้อนรับสู่ MODE Fashion Store</small></div>
  <div class="topright"><span class="student-chip">รหัสนักศึกษา 69000437126</span><div class="avatar">MS</div><div><strong style="color:#29334a">ผู้ดูแลระบบ</strong><br><span>Admin</span></div></div>
</header>
<div class="content" id="content"></div>
</main>
</div>
<div class="modal-back" id="modalBack"><div class="modal"><div class="modal-head"><h2 id="modalTitle">เพิ่มสินค้า</h2><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const STUDENT_ID='69000437126';
const initialProducts=[
{id:'CL001',name:'เสื้อยืด Basic Cotton',category:'เสื้อยืด',size:'M',color:'ขาว',price:290,stock:24,emoji:'👕'},
{id:'CL002',name:'เสื้อเชิ้ต Oversize',category:'เสื้อเชิ้ต',size:'L',color:'ฟ้า',price:590,stock:12,emoji:'👔'},
{id:'CL003',name:'กางเกงยีนส์ Classic',category:'กางเกง',size:'M',color:'ยีนส์',price:790,stock:8,emoji:'👖'},
{id:'CL004',name:'เดรส Minimal',category:'เดรส',size:'S',color:'ครีม',price:890,stock:6,emoji:'👗'},
{id:'CL005',name:'เสื้อคลุม Knit',category:'เสื้อคลุม',size:'Free Size',color:'น้ำตาล',price:650,stock:15,emoji:'🧥'},
{id:'CL006',name:'กระโปรง Pleated',category:'กระโปรง',size:'M',color:'ดำ',price:490,stock:3,emoji:'👚'},
{id:'CL007',name:'เสื้อโปโล Everyday',category:'เสื้อโปโล',size:'L',color:'เขียว',price:390,stock:20,emoji:'👕'},
{id:'CL008',name:'แจ็กเก็ต Denim',category:'เสื้อคลุม',size:'L',color:'ยีนส์',price:990,stock:0,emoji:'🧥'},
{id:'CL009',name:'กางเกงผ้า Relax',category:'กางเกง',size:'M',color:'ดำ',price:550,stock:11,emoji:'👖'}
];
let products=JSON.parse(localStorage.getItem('mode_products')||'null')||initialProducts;
let sales=JSON.parse(localStorage.getItem('mode_sales')||'[]');
let cart={};let page='dashboard';
const money=n=>'฿'+Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('mode_products',JSON.stringify(products));localStorage.setItem('mode_sales',JSON.stringify(sales))}
function notify(msg){let t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function setHead(title,sub){document.getElementById('topTitle').innerHTML=esc(title)+'<small>'+esc(sub)+'</small>'}
function head(title,sub,button=''){return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${button}</div></div>`}
function stat(label,value,icon,foot){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}
function productStatus(p){return p.stock===0?'<span class="pill out">สินค้าหมด</span>':p.stock<=5?'<span class="pill low">ใกล้หมด</span>':'<span class="pill">พร้อมขาย</span>'}
function render(){if(page==='dashboard')renderDashboard();if(page==='products')renderProducts();if(page==='sales')renderSales();if(page==='reports')renderReports();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function renderDashboard(){
setHead('ภาพรวมระบบ','สรุปผลการดำเนินงานของร้าน MODE Fashion Store');
let revenue=sales.reduce((a,s)=>a+s.total,0),units=products.reduce((a,p)=>a+p.stock,0),low=products.filter(p=>p.stock<=5).length;
let last7=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));let key=d.toLocaleDateString('th-TH',{day:'2-digit',month:'short'});let total=sales.filter(s=>new Date(s.date).toDateString()===d.toDateString()).reduce((a,s)=>a+s.total,0);return {key,total}});
let max=Math.max(1,...last7.map(x=>x.total));
document.getElementById('content').innerHTML=head('ภาพรวมร้านค้า','ยินดีต้อนรับกลับมา นี่คือข้อมูลสรุปของร้านคุณ')+
`<div class="stats">${stat('ยอดขายสะสม',money(revenue),'↗','จากรายการขายทั้งหมด')}${stat('รายการขาย',sales.length.toLocaleString(),'▤','จำนวนบิลที่บันทึก')}${stat('สินค้าคงเหลือ',units.toLocaleString(),'◈','จำนวนชิ้นในสต็อก')}${stat('สินค้าต้องเติม',low.toLocaleString(),'⚑',low?'ควรตรวจสอบสต็อก':'สต็อกอยู่ในเกณฑ์')}</div>
<div class="layout2"><section class="panel"><h2>ยอดขาย 7 วันล่าสุด</h2><p class="panel-sub">ยอดขายรายวันจากรายการที่บันทึกไว้</p><div class="bar-chart">${last7.map(x=>`<div class="bar-group"><div class="bar" title="${money(x.total)}" style="height:${Math.max(3,x.total/max*78)}%"></div><div class="bar-label">${x.key}</div></div>`).join('')}</div><div style="margin-top:14px;color:#778198;font-size:11px">ยอดขายรวม: <strong style="color:#20283a">${money(revenue)}</strong></div></section>
<section class="panel"><h2>สรุปสต็อกสินค้า</h2><p class="panel-sub">สถานะสินค้าในคลัง</p><div class="category-row"><span class="dot"></span><span>พร้อมขาย (มากกว่า 5 ชิ้น)</span><strong>${products.filter(p=>p.stock>5).length}</strong></div><div class="category-row"><span class="dot" style="background:#f3ae48"></span><span>ใกล้หมด (1–5 ชิ้น)</span><strong>${products.filter(p=>p.stock>0&&p.stock<=5).length}</strong></div><div class="category-row"><span class="dot" style="background:#e35c70"></span><span>สินค้าหมด</span><strong>${products.filter(p=>p.stock===0).length}</strong></div><button class="secondary" style="width:100%;margin-top:15px" onclick="setPage('products')">จัดการสินค้า →</button></section></div>
<section class="panel" style="margin-top:18px"><h2>รายการขายล่าสุด</h2>${sales.length?`<div class="table-wrap"><table><thead><tr><th>เลขที่บิล</th><th>วันที่และเวลา</th><th>จำนวนรายการ</th><th>ยอดสุทธิ</th></tr></thead><tbody>${sales.slice().reverse().slice(0,5).map(s=>`<tr><td><strong>${esc(s.id)}</strong></td><td>${new Date(s.date).toLocaleString('th-TH')}</td><td>${s.items.reduce((a,i)=>a+i.qty,0)} ชิ้น</td><td><strong>${money(s.total)}</strong></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ยังไม่มีรายการขาย เริ่มขายสินค้าเพื่อดูข้อมูลสรุป</div>'}</section>
<div class="footer-student">ผลงานนักศึกษา รหัส 69000437126 · MODE Fashion Store</div>`;
}
function renderProducts(){
setHead('จัดการสินค้า','เพิ่ม แก้ไข ค้นหา และตรวจสอบสต็อกสินค้า');
document.getElementById('content').innerHTML=head('จัดการสินค้า','ดูแลข้อมูลเสื้อผ้า ราคา ไซซ์ สี และจำนวนคงเหลือ',`<button onclick="openProductModal()">＋ เพิ่มสินค้า</button>`)+
`<div class="stats">${stat('สินค้าทั้งหมด',products.length,'◈','รายการสินค้า')}${stat('จำนวนคงเหลือ',products.reduce((a,p)=>a+p.stock,0),'▦','รวมทุกไซซ์')}${stat('ใกล้หมด',products.filter(p=>p.stock>0&&p.stock<=5).length,'⚑','คงเหลือไม่เกิน 5 ชิ้น')}${stat('สินค้าหมด',products.filter(p=>p.stock===0).length,'○','ต้องเติมสต็อก')}</div>
<div class="panel"><div class="toolbar"><input id="productSearch" placeholder="ค้นหาชื่อสินค้า / รหัสสินค้า..." oninput="filterProducts()"><select id="categoryFilter" onchange="filterProducts()"><option value="">ทุกหมวดหมู่</option>${[...new Set(products.map(p=>p.category))].map(c=>`<option>${esc(c)}</option>`).join('')}</select><button class="light" onclick="exportProducts()">ส่งออก CSV</button></div><div id="productsTable"></div></div><div class="footer-student">รหัสนักศึกษา 69000437126</div>`;
filterProducts();
}
function filterProducts(){let q=(document.getElementById('productSearch')?.value||'').toLowerCase(),cat=document.getElementById('categoryFilter')?.value||'';let arr=products.filter(p=>(p.name+' '+p.id+' '+p.category).toLowerCase().includes(q)&&(!cat||p.category===cat));let el=document.getElementById('productsTable');if(!el)return;el.innerHTML=arr.length?`<div class="table-wrap"><table><thead><tr><th>สินค้า</th><th>รหัส</th><th>หมวดหมู่</th><th>ไซซ์ / สี</th><th>ราคา</th><th>คงเหลือ</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>${arr.map(p=>`<tr><td><div class="product-cell"><div class="product-pic">${p.emoji||'👕'}</div><div class="product-name">${esc(p.name)}</div></div></td><td>${esc(p.id)}</td><td>${esc(p.category)}</td><td>${esc(p.size)} / ${esc(p.color)}</td><td><strong>${money(p.price)}</strong></td><td>${p.stock}</td><td>${productStatus(p)}</td><td><button class="secondary btn-sm" onclick="openProductModal('${esc(p.id)}')">แก้ไข</button> <button class="danger btn-sm" onclick="deleteProduct('${esc(p.id)}')">ลบ</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ไม่พบสินค้า</div>'}
function openProductModal(id=''){let p=products.find(x=>x.id===id)||{id:'',name:'',category:'เสื้อยืด',size:'M',color:'ดำ',price:'',stock:'',emoji:'👕'};document.getElementById('modalTitle').textContent=id?'แก้ไขข้อมูลสินค้า':'เพิ่มสินค้าใหม่';document.getElementById('modalBody').innerHTML=`<form id="productForm" onsubmit="saveProduct(event,'${esc(id)}')"><div class="form-grid"><label class="field">รหัสสินค้า<input name="id" required value="${esc(p.id)}" ${id?'readonly':''} placeholder="เช่น CL010"></label><label class="field">ชื่อสินค้า<input name="name" required value="${esc(p.name)}" placeholder="ชื่อสินค้า"></label><label class="field">หมวดหมู่<select name="category">${['เสื้อยืด','เสื้อเชิ้ต','เสื้อโปโล','เสื้อคลุม','กางเกง','กระโปรง','เดรส','อื่น ๆ'].map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="field">ไซซ์<input name="size" required value="${esc(p.size)}" placeholder="S / M / L / Free Size"></label><label class="field">สี<input name="color" required value="${esc(p.color)}"></label><label class="field">ราคา (บาท)<input name="price" type="number" min="0" step=".01" required value="${esc(p.price)}"></label><label class="field">จำนวนคงเหลือ<input name="stock" type="number" min="0" step="1" required value="${esc(p.stock)}"></label><label class="field">อีโมจิแทนสินค้า<input name="emoji" value="${esc(p.emoji)}" maxlength="8"></label></div><div class="modal-actions"><button type="button" class="light" onclick="closeModal()">ยกเลิก</button><button type="submit">บันทึกข้อมูล</button></div></form>`;document.getElementById('modalBack').style.display='flex'}
function saveProduct(e,oldId){e.preventDefault();let f=new FormData(e.target),p={id:f.get('id').trim(),name:f.get('name').trim(),category:f.get('category'),size:f.get('size').trim(),color:f.get('color').trim(),price:Number(f.get('price')),stock:Number(f.get('stock')),emoji:f.get('emoji')||'👕'};if(!oldId&&products.some(x=>x.id===p.id)){notify('รหัสสินค้านี้มีอยู่แล้ว');return}if(oldId)products=products.map(x=>x.id===oldId?p:x);else products.push(p);save();closeModal();renderProducts();notify('บันทึกข้อมูลสินค้าแล้ว')}
function deleteProduct(id){if(!confirm('ต้องการลบสินค้า '+id+' ใช่หรือไม่?'))return;products=products.filter(p=>p.id!==id);save();renderProducts();notify('ลบสินค้าแล้ว')}
function closeModal(){document.getElementById('modalBack').style.display='none'}
document.getElementById('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});
function renderSales(){setHead('ขายสินค้า','เลือกสินค้า เพิ่มลงตะกร้า และบันทึกการขาย');document.getElementById('content').innerHTML=head('ขายสินค้า','ระบบขายหน้าร้าน (POS) สำหรับร้านเสื้อผ้า')+`<div class="notice">💡 เลือกสินค้าที่ต้องการขายจากรายการด้านซ้าย ระบบจะคำนวณยอดรวมและตัดสต็อกเมื่อกด “ยืนยันการขาย” รหัสนักศึกษา 69000437126</div><div class="sale-layout"><section class="panel"><div class="toolbar"><input id="saleSearch" placeholder="ค้นหาสินค้า..." oninput="filterSaleProducts()"><select id="saleCategory" onchange="filterSaleProducts()"><option value="">ทุกหมวดหมู่</option>${[...new Set(products.map(p=>p.category))].map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div id="saleProductGrid" class="product-grid"></div></section><section class="panel"><h2>🛒 ตะกร้าสินค้า</h2><div id="cartLines"></div><div id="cartTotals"></div><div class="field" style="margin-top:14px">วิธีชำระเงิน<select id="paymentMethod"><option>เงินสด</option><option>โอนเงิน</option><option>บัตรเครดิต/เดบิต</option></select></div><button style="width:100%;margin-top:14px;padding:13px" onclick="checkout()">ยืนยันการขาย</button><button class="light" style="width:100%;margin-top:8px" onclick="clearCart()">ล้างตะกร้า</button></section></div><section class="panel" style="margin-top:18px"><h2>ประวัติการขายล่าสุด</h2>${sales.length?`<div class="table-wrap"><table><thead><tr><th>เลขที่บิล</th><th>วันเวลา</th><th>รายการ</th><th>ชำระโดย</th><th>ยอดรวม</th></tr></thead><tbody>${sales.slice().reverse().slice(0,6).map(s=>`<tr><td>${esc(s.id)}</td><td>${new Date(s.date).toLocaleString('th-TH')}</td><td>${s.items.length} รายการ</td><td>${esc(s.payment)}</td><td><strong>${money(s.total)}</strong></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ยังไม่มีประวัติการขาย</div>'}</section><div class="footer-student">รหัสนักศึกษา 69000437126</div>`;filterSaleProducts();renderCart()}
function filterSaleProducts(){let q=(document.getElementById('saleSearch')?.value||'').toLowerCase(),cat=document.getElementById('saleCategory')?.value||'';let arr=products.filter(p=>(p.name+' '+p.id).toLowerCase().includes(q)&&(!cat||p.category===cat));let el=document.getElementById('saleProductGrid');if(!el)return;el.innerHTML=arr.map(p=>`<button class="product-card" onclick="addToCart('${esc(p.id)}')" ${p.stock<=0?'disabled style="opacity:.5;cursor:not-allowed"':''}><div class="product-emoji">${p.emoji||'👕'}</div><strong>${esc(p.name)}</strong><small>${esc(p.size)} · ${esc(p.color)} · คงเหลือ ${p.stock}</small><b>${money(p.price)}</b>${p.stock<=0?'<span class="pill out">สินค้าหมด</span>':'<span class="pill">＋ เพิ่มลงตะกร้า</span>'}</button>`).join('')||'<div class="empty">ไม่พบสินค้า</div>'}
function addToCart(id){let p=products.find(x=>x.id===id);if(!p||p.stock<=0)return;if((cart[id]||0)>=p.stock){notify('จำนวนสินค้าเกินสต็อก');return}cart[id]=(cart[id]||0)+1;renderCart()}
function changeQty(id,d){let p=products.find(x=>x.id===id);cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];else if(cart[id]>p.stock){cart[id]=p.stock;notify('จำนวนสินค้าเกินสต็อก')}renderCart()}
function renderCart(){let el=document.getElementById('cartLines');if(!el)return;let ids=Object.keys(cart);el.innerHTML=ids.length?ids.map(id=>{let p=products.find(x=>x.id===id);return `<div class="cart-line"><div><strong>${esc(p.name)}</strong><div class="muted" style="margin-top:4px">${money(p.price)} / ชิ้น</div><div class="qty-controls"><button onclick="changeQty('${esc(id)}',-1)">−</button><span>${cart[id]}</span><button onclick="changeQty('${esc(id)}',1)">+</button></div></div><strong>${money(p.price*cart[id])}</strong></div>`}).join(''):'<div class="empty">ยังไม่มีสินค้าในตะกร้า</div>';let sub=ids.reduce((a,id)=>a+products.find(p=>p.id===id).price*cart[id],0);document.getElementById('cartTotals').innerHTML=`<div class="total-row"><span>ยอดรวมสินค้า</span><strong>${money(sub)}</strong></div><div class="total-row"><span>ส่วนลด</span><span>${money(0)}</span></div><div class="total-row grand"><span>ยอดสุทธิ</span><span>${money(sub)}</span></div>`}
function clearCart(){cart={};renderCart();notify('ล้างตะกร้าแล้ว')}
function checkout(){let ids=Object.keys(cart);if(!ids.length){notify('กรุณาเลือกสินค้าก่อน');return}for(let id of ids){let p=products.find(x=>x.id===id);if(!p||p.stock<cart[id]){notify('สต็อกสินค้าไม่เพียงพอ');return}}let items=ids.map(id=>{let p=products.find(x=>x.id===id);return {id:p.id,name:p.name,price:p.price,qty:cart[id],subtotal:p.price*cart[id]}}),total=items.reduce((a,i)=>a+i.subtotal,0);products=products.map(p=>cart[p.id]?{...p,stock:p.stock-cart[p.id]}:p);let sale={id:'SO'+Date.now().toString().slice(-8),date:new Date().toISOString(),items,total,payment:document.getElementById('paymentMethod').value,studentId:STUDENT_ID};sales.push(sale);save();cart={};renderSales();notify('บันทึกการขายสำเร็จ เลขที่บิล '+sale.id);setTimeout(()=>showReceipt(sale),250)}
function showReceipt(s){document.getElementById('modalTitle').textContent='บันทึกการขายสำเร็จ';document.getElementById('modalBody').innerHTML=`<div style="text-align:center;padding:5px 0 16px"><div style="font-size:28px">✓</div><h2 style="margin:8px">ชำระเงินเรียบร้อย</h2><p class="muted">MODE FASHION STORE</p></div><div style="font-size:12px;line-height:2.1"><div>เลขที่บิล: <strong>${esc(s.id)}</strong></div><div>วันที่: ${new Date(s.date).toLocaleString('th-TH')}</div><div>วิธีชำระเงิน: ${esc(s.payment)}</div><hr style="border:0;border-top:1px dashed #ddd">${s.items.map(i=>`<div style="display:flex;justify-content:space-between;gap:10px"><span>${esc(i.name)} × ${i.qty}</span><strong>${money(i.subtotal)}</strong></div>`).join('')}<hr style="border:0;border-top:1px dashed #ddd"><div style="display:flex;justify-content:space-between;font-size:17px"><strong>ยอดสุทธิ</strong><strong>${money(s.total)}</strong></div><p class="muted">รหัสนักศึกษา ${STUDENT_ID}</p></div><div class="modal-actions"><button class="light" onclick="closeModal()">ปิด</button><button onclick="printReceipt('${esc(s.id)}')">พิมพ์ใบเสร็จ</button></div>`;document.getElementById('modalBack').style.display='flex'}
function printReceipt(id){let s=sales.find(x=>x.id===id);if(!s)return;let w=window.open('','_blank','width=600,height=700');if(!w){notify('เบราว์เซอร์บล็อกหน้าต่างพิมพ์');return}w.document.write(`<html><head><title>Receipt ${esc(s.id)}</title><style>body{font:14px Tahoma,Arial;padding:30px;max-width:500px;margin:auto}h2{text-align:center}table{width:100%;border-collapse:collapse}td{padding:8px 0;border-bottom:1px dashed #ddd}.right{text-align:right}</style></head><body><h2>MODE FASHION STORE</h2><p style="text-align:center">ใบเสร็จรับเงิน</p><p>เลขที่: ${esc(s.id)}<br>วันที่: ${new Date(s.date).toLocaleString('th-TH')}<br>ชำระโดย: ${esc(s.payment)}</p><table>${s.items.map(i=>`<tr><td>${esc(i.name)} × ${i.qty}</td><td class="right">${money(i.subtotal)}</td></tr>`).join('')}<tr><td><strong>ยอดสุทธิ</strong></td><td class="right"><strong>${money(s.total)}</strong></td></tr></table><p>รหัสนักศึกษา ${STUDENT_ID}</p><p style="text-align:center">ขอบคุณที่ใช้บริการ</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function renderReports(){setHead('รายงาน','สรุปยอดขายและรายการสินค้าเพื่อใช้ตรวจสอบและพิมพ์');document.getElementById('content').innerHTML=head('รายงาน','ดูรายงานยอดขาย กรองวันที่ และส่งออกข้อมูล',`<button class="light" onclick="window.print()">⎙ พิมพ์รายงาน</button><button onclick="exportSales()">ส่งออก CSV</button>`)+`<div class="panel"><div class="toolbar"><label class="field" style="min-width:150px">ตั้งแต่วันที่<input id="reportFrom" type="date" onchange="filterReports()"></label><label class="field" style="min-width:150px">ถึงวันที่<input id="reportTo" type="date" onchange="filterReports()"></label><button class="light" onclick="resetReportDates()">ล้างตัวกรอง</button></div><div id="reportContent"></div></div><section class="panel" style="margin-top:18px"><h2>รายงานสต็อกสินค้า</h2><div class="table-wrap"><table><thead><tr><th>รหัสสินค้า</th><th>ชื่อสินค้า</th><th>หมวดหมู่</th><th>ไซซ์</th><th>ราคา</th><th>คงเหลือ</th><th>มูลค่าสต็อก</th></tr></thead><tbody>${products.map(p=>`<tr><td>${esc(p.id)}</td><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${esc(p.size)}</td><td>${money(p.price)}</td><td>${p.stock}</td><td>${money(p.stock*p.price)}</td></tr>`).join('')}</tbody></table></div><div class="total-row grand"><span>มูลค่าสต็อกรวม</span><span>${money(products.reduce((a,p)=>a+p.stock*p.price,0))}</span></div></section><div class="footer-student">รายงานจัดทำจากระบบ MODE · รหัสนักศึกษา 69000437126</div>`;filterReports()}
function getFilteredSales(){let from=document.getElementById('reportFrom')?.value,to=document.getElementById('reportTo')?.value;return sales.filter(s=>{let d=new Date(s.date);return(!from||d>=new Date(from+'T00:00:00'))&&(!to||d<=new Date(to+'T23:59:59'))})}
function filterReports(){let el=document.getElementById('reportContent');if(!el)return;let arr=getFilteredSales(),rev=arr.reduce((a,s)=>a+s.total,0),qty=arr.reduce((a,s)=>a+s.items.reduce((n,i)=>n+i.qty,0),0);el.innerHTML=`<div class="report-cards"><div class="report-card"><small>ยอดขายสุทธิ</small><strong>${money(rev)}</strong></div><div class="report-card"><small>จำนวนบิล</small><strong>${arr.length.toLocaleString()}</strong></div><div class="report-card"><small>จำนวนชิ้นที่ขาย</small><strong>${qty.toLocaleString()}</strong></div></div><h2 style="margin-top:24px">รายละเอียดการขาย</h2>${arr.length?`<div class="table-wrap"><table><thead><tr><th>เลขที่บิล</th><th>วันที่และเวลา</th><th>สินค้า</th><th>จำนวนชิ้น</th><th>วิธีชำระเงิน</th><th>ยอดสุทธิ</th></tr></thead><tbody>${arr.slice().reverse().map(s=>`<tr><td>${esc(s.id)}</td><td>${new Date(s.date).toLocaleString('th-TH')}</td><td>${s.items.map(i=>esc(i.name)).join(', ')}</td><td>${s.items.reduce((a,i)=>a+i.qty,0)}</td><td>${esc(s.payment)}</td><td><strong>${money(s.total)}</strong></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ไม่มีรายการขายในช่วงวันที่ที่เลือก</div>'}`}
function resetReportDates(){document.getElementById('reportFrom').value='';document.getElementById('reportTo').value='';filterReports()}
function downloadCSV(filename,rows){let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url)}
function exportProducts(){downloadCSV('MODE_products.csv',[['รหัสสินค้า','ชื่อสินค้า','หมวดหมู่','ไซซ์','สี','ราคา','คงเหลือ'],...products.map(p=>[p.id,p.name,p.category,p.size,p.color,p.price,p.stock])]);notify('ส่งออกข้อมูลสินค้าแล้ว')}
function exportSales(){let arr=getFilteredSales();downloadCSV('MODE_sales_report.csv',[['เลขที่บิล','วันที่','สินค้า','จำนวนชิ้น','วิธีชำระเงิน','ยอดสุทธิ','รหัสนักศึกษา'],...arr.map(s=>[s.id,new Date(s.date).toLocaleString('th-TH'),s.items.map(i=>i.name).join(' / '),s.items.reduce((a,i)=>a+i.qty,0),s.payment,s.total,STUDENT_ID])]);notify('ส่งออกรายงานแล้ว')}
render();
</script>
</body>
</html>
